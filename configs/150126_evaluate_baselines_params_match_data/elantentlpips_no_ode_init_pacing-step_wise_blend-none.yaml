# generator_ckpt: ${oc.env:DATASET_PATH}self_forcing/self_forcing/checkpoints/ode_init.pt #/home/ma-user/work/dataset/self_forcing/self_forcing/checkpoints/ode_init.pt
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.1-T2V-1.3B
text_encoder_fsdp_wrap_strategy: size
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true # need to remove - 0 in denoising_step_list if warp_denoising_step is true
ts_schedule: false
num_train_timestep: 1000 # 1000 by default  # this is used for the scheduler
timestep_shift: 8.0
guidance_scale: 5.0
denoising_loss_type: flow
mixed_precision: true
seed: 0
wandb_host: WANDB_HOST
wandb_key: WANDB_KEY
wandb_entity: WANDB_ENTITY_PROGRESSIVE_LPIPS_NO_ODE_INIT
wandb_project: WANDB_PROJECT_PROGRESSIVE_LPIPS_NO_ODE_INIT
sharding_strategy: hybrid_full
lr: 2.0e-06
lr_critic: 4.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
data_path: prompts/vidprom_filtered_extended.txt
batch_size: 1
ema_weight: 0.99
ema_start_step: 2 # 200
total_batch_size: 64 # this is used for ode initalization, no mention in distillation.py
log_iters: 50 # 50
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 21
- 16
- 60
- 104
distribution_loss: progressive_dmd
trainer: progressive_score_distillation
gradient_checkpointing: true
num_frame_per_block: 3
load_raw_video: false
model_kwargs:
  timestep_shift: 8.0
gradient_accumulation_steps: 8 # across 8gpus, effective bs=64

# window settings
initial_first_window_size: 7
first_window_loss_method: lpips
first_window_loss_scale_scheduler: "use_0" # or "use_0" "use_1" "first_window_loss_scale_scheduler" 

reg_loss_method: lpips
# reg_loss_coefficient: 0.25 # matches the 0.25 regression loss term scaling of DMD, and Diadistill
reg_loss_coefficient: 0.0 # set to 0 so no affect for now
regression_data_path: ${oc.env:DATASET_PATH}john_env/self_forcing_clone/self_forcing/latent_form_bidirectional_diffusion_inference_videos_guidance5.0_wan1.3B_vidprom_4ksamples_lmdb

using_first_window_loss: false
use_dmd_regression_loss: false
use_first_window_dmd_regression_loss: false


# pacing function parameters
pacing_kwargs: 
    pacing_function: "step_wise" # none_wise, step_wise, loss_wise 
    blending_method: "none" # none, coin_toss_stochastic, loss_based_stochastic
    step_wise_thresholds:
        - [200, 7] # 200 for first_window_size=7
        - [250, 6] # 50 for first_window_size=6
        - [300, 5]
        - [350, 4]
        - [400, 3]
        - [450, 2]
        - [500, 1]
